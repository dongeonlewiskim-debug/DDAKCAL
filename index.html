<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDAKCAL</title>
<!-- 크롬 탭 아이콘 (파비콘) -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- PWA (홈 화면 설치 / 앱처럼 구동) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f0728f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DDAKCAL">
<!-- 링크 미리보기 (카톡·SNS 등에서 뜨는 카드) -->
<meta property="og:type" content="website">
<meta property="og:title" content="DDAKCAL">
<meta property="og:description" content="나에게 딱 맞는 스케줄러">
<meta property="og:image" content="https://ddakcal.xyz/logo.png">
<meta property="og:url" content="https://ddakcal.xyz">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DDAKCAL">
<meta name="twitter:description" content="나에게 딱 맞는 스케줄러">
<meta name="twitter:image" content="https://ddakcal.xyz/logo.png">
<!-- 테마: 깜빡임 방지를 위해 스타일 적용 전에 미리 설정 -->
<script>try{var _t=localStorage.getItem('ddakcal_theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<style>
  /* ============================================================
     Clean blue — minimal daily schedule (reference-matched)
     ============================================================ */
  @import url('https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css');
  :root{
    --blue:#f0728f;
    --blue-deep:#e05a7b;
    --blue-soft:#fdecf1;
    --bg:#ffffff;
    --card-soft:#f5f6f9;   /* flat light card */
    --text:#1b1e28;        /* near-black */
    --muted:#a2a8b6;       /* soft gray */
    --border:#eef0f4;
    --danger:#f2686b;
    --amber:#ffb84f;
    --radius:18px;
    --shadow:0 10px 26px rgba(240,114,143,.12);
    --shadow-blue:0 14px 30px rgba(240,114,143,.38);
    --surface:#ffffff;
    --surface-hover:#eef0f4;
  }
  /* ===== 다크 테마 (data-theme="dark") ===== */
  :root[data-theme="dark"]{
    --blue-soft:#3a2530;
    --bg:#0e0f13;
    --card-soft:#1a1c22;
    --text:#f2f3f5;
    --muted:#9096a6;
    --border:#2a2d36;
    --shadow:0 10px 26px rgba(0,0,0,.45);
    --shadow-blue:0 14px 30px rgba(240,114,143,.30);
    --surface:#1f2129;
    --surface-hover:#262933;
    color-scheme:dark;
  }
  /* 흰색으로 하드코딩됐던 표면들 — 다크에서만 덮어씀 */
  :root[data-theme="dark"] .vt-btn.active{background:var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.4);}
  :root[data-theme="dark"] .node{background:var(--surface);}
  :root[data-theme="dark"] .check{border-color:#3a3e4a;}
  :root[data-theme="dark"] .icon-btn:hover{background:var(--surface-hover);}
  :root[data-theme="dark"] .cal-day.other{color:#4a4e5a;}
  :root[data-theme="dark"] .cat-item .cat-del:hover{background:var(--surface);}
  :root[data-theme="dark"] .m-head,
  :root[data-theme="dark"] .m-cell{background:var(--surface);}
  :root[data-theme="dark"] .m-cell:hover{background:var(--surface-hover);}
  :root[data-theme="dark"] .m-cell.other{background:#171921;}
  :root[data-theme="dark"] .m-cell.other .m-daynum{color:#4a4e5a;}
  :root[data-theme="dark"] .modal{background:var(--surface);box-shadow:0 24px 60px rgba(0,0,0,.6);}
  :root[data-theme="dark"] .field input[type=text],
  :root[data-theme="dark"] .field input[type=time],
  :root[data-theme="dark"] .field input[type=date],
  :root[data-theme="dark"] .field textarea,
  :root[data-theme="dark"] .field select{background:var(--card-soft);color:var(--text);}
  :root[data-theme="dark"] .field input:focus,
  :root[data-theme="dark"] .field textarea:focus,
  :root[data-theme="dark"] .field select:focus{background:var(--surface);}
  :root[data-theme="dark"] .btn-danger{background:var(--surface);}
  :root[data-theme="dark"] .login-gate{background:var(--bg);}
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a3e4a;}
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;touch-action:manipulation;}   /* 가로 넘침 방지 + 더블탭 확대 차단 */
  body{
    margin:0;
    font-family:'Freesentation',-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  /* make every button / form control use the same font, not the browser default */
  button,input,select,textarea{font-family:inherit;}
  .chart-wrap svg{font-family:'Freesentation',-apple-system,"Malgun Gothic",sans-serif;}
  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
    width:100%;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--bg);
    border-right:1px solid var(--border);
    padding:30px 24px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-weight:800;font-size:18px;letter-spacing:-.01em;
  }
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);}
  .cal-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  }
  .cal-header .month{font-weight:800;font-size:15px;}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{
    border:none;background:var(--card-soft);width:28px;height:28px;border-radius:9px;
    cursor:pointer;color:var(--muted);font-size:14px;line-height:1;
  }
  .cal-nav button:hover{background:var(--blue-soft);color:var(--blue);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px;}
  .cal-grid .wd{text-align:center;color:var(--muted);padding:4px 0;font-weight:700;font-size:10.5px;}
  .cal-day{
    text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;
    color:var(--text);position:relative;font-weight:600;
  }
  .cal-day.other{color:#d9dce4;}
  .cal-day:hover{background:var(--blue-soft);}
  .cal-day.selected{background:var(--blue);color:#fff;font-weight:800;box-shadow:var(--shadow-blue);}
  .cal-day.today:not(.selected){color:var(--blue);font-weight:800;}
  .cal-day.today:not(.selected)::after{
    content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--blue);
  }
  .cal-day.has-task:not(.selected)::before{
    content:"";position:absolute;top:4px;right:7px;
    width:4px;height:4px;border-radius:50%;background:var(--amber);
  }
  .section-title{
    font-size:11px;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;
  }
  .cat-list{display:flex;flex-direction:column;gap:2px;}
  .cat-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;
    transition:background .12s ease;
  }
  .cat-item:hover{background:var(--card-soft);}
  .cat-item.off{opacity:.4;}
  .cat-swatch{width:10px;height:10px;border-radius:4px;flex:none;}
  .cat-item span.name{flex:1;}
  .cat-item .cnt{color:var(--muted);font-size:12px;font-weight:600;}
  .cat-item .cat-del{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;flex:none;
    width:20px;height:20px;border-radius:6px;opacity:.3;line-height:1;
    transition:opacity .12s ease,color .12s ease,background .12s ease;
  }
  .cat-item:hover .cat-del{opacity:.7;}
  .cat-item .cat-del:hover{opacity:1;color:var(--danger);background:#fff;}
  .add-cat-btn{
    margin-top:8px;border:1.5px dashed var(--border);background:none;
    color:var(--muted);border-radius:11px;padding:9px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .add-cat-btn:hover{border-color:var(--blue);color:var(--blue);}
  .logo-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .theme-toggle{
    border:1.5px solid var(--border);background:var(--card-soft);cursor:pointer;
    width:34px;height:34px;border-radius:10px;font-size:16px;line-height:1;flex:none;
    display:flex;align-items:center;justify-content:center;transition:background .12s ease;
  }
  .theme-toggle:hover{background:var(--surface-hover);}
  .sidebar-footer{margin-top:auto;display:flex;gap:8px;}
  .ghost-btn{
    flex:1;border:none;background:var(--card-soft);color:var(--muted);
    padding:10px 6px;border-radius:11px;font-size:12px;cursor:pointer;font-weight:600;
  }
  .ghost-btn:hover{background:var(--blue-soft);color:var(--blue);}

  /* ---------- Main ---------- */
  .main{padding:36px 44px;}
  .main-header{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;
  }
  .date-block .sub{color:var(--muted);font-size:14px;margin-bottom:6px;font-weight:500;}
  .date-block h1{font-size:38px;margin:0;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .day-nav{display:flex;align-items:center;gap:8px;}
  .day-nav button{
    border:none;background:var(--card-soft);width:38px;height:38px;
    border-radius:12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;
  }
  .day-nav button:hover{background:var(--blue-soft);color:var(--blue);}
  .add-task-btn{
    background:var(--blue);color:#fff;border:none;padding:12px 20px;
    border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-blue);
    transition:background .15s ease;
  }
  .add-task-btn:hover{background:var(--blue-deep);}

  .view-toggle{
    display:flex;background:var(--card-soft);border-radius:14px;
    padding:4px;gap:2px;margin-bottom:24px;
  }
  .vt-btn{
    flex:1;border:none;background:none;color:var(--muted);padding:9px 8px;border-radius:10px;
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .vt-btn.active{background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(27,30,40,.08);}
  /* 할일/일정 리스트: 날짜 구분 헤더 + 연결선 없음 */
  .list-date-head{font-size:13px;font-weight:800;color:var(--muted);margin:20px 0 10px 2px;letter-spacing:.01em;}
  .list-date-head:first-child{margin-top:2px;}
  .timeline.flat .line{display:none;}

  /* week strip — clean text columns (no boxes), reference style */
  .week-strip{
    display:flex;gap:4px;margin-bottom:30px;
  }
  .week-day{
    flex:1;text-align:center;padding:6px 2px 8px;border-radius:14px;cursor:pointer;
    transition:background .12s ease;
  }
  .week-day:hover{background:var(--card-soft);}
  .week-day .wd{font-size:13px;color:var(--muted);font-weight:600;}
  .week-day .dnum{font-size:20px;font-weight:800;margin-top:6px;color:var(--text);}
  .week-day.selected{background:none;}
  .week-day.selected .wd,.week-day.selected .dnum{color:var(--blue);}
  .week-day .dot{
    width:5px;height:5px;border-radius:50%;background:var(--blue);margin:5px auto 0;opacity:0;
  }
  .week-day.selected .dot{opacity:1;}

  .timeline{position:relative;}
  .task-row{display:flex;gap:16px;position:relative;}
  .track{
    display:flex;flex-direction:column;align-items:center;width:14px;flex:none;
  }
  .node{
    width:13px;height:13px;border-radius:50%;border:2.5px solid var(--blue);background:#fff;
    margin-top:26px;flex:none;
  }
  .node.done{background:var(--blue);}
  .node.current{
    box-shadow:0 0 0 4px var(--blue-soft);
  }
  .line{width:2px;flex:1;background:var(--border);margin-top:4px;}
  .task-row:last-child .line{display:none;}

  /* cards — flat light gray; the "current" one becomes the blue hero */
  .task-card{
    flex:1;background:var(--card-soft);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:14px;position:relative;
    transition:transform .15s ease;
  }
  .task-card.done{opacity:.5;}
  .task-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .task-card .title-wrap{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;}
  .check{
    width:20px;height:20px;border-radius:7px;border:2px solid #d7dbe4;flex:none;
    cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;transition:background .12s ease,border-color .12s ease;
  }
  .check.checked{background:var(--blue);border-color:var(--blue);}
  .task-card h3{margin:0;font-size:16px;font-weight:800;word-break:break-word;line-height:1.35;}
  .task-card.done h3{text-decoration:line-through;color:var(--muted);}
  .time-badge{font-size:13.5px;color:var(--muted);font-weight:600;white-space:nowrap;flex:none;}
  .task-desc{color:var(--muted);font-size:13.5px;margin:8px 0 0 32px;line-height:1.55;}
  .repeat-tag{font-size:11.5px;color:var(--blue);margin:8px 0 0 32px;font-weight:700;}
  .task-meta{display:flex;align-items:center;gap:8px;margin:12px 0 0 32px;}
  .cat-tag{font-size:11.5px;padding:4px 11px;border-radius:20px;font-weight:700;}
  .task-actions{display:flex;gap:4px;margin-left:auto;}
  .icon-btn{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;
    width:27px;height:27px;border-radius:8px;
  }
  .icon-btn:hover{background:#e7eaf0;color:var(--blue);}
  .icon-btn.del:hover{color:var(--danger);}
  .icon-btn.skip:hover{color:var(--amber);}

  /* ----- current (in-progress) card: solid blue hero ----- */
  .task-card.current{
    background:var(--blue);box-shadow:var(--shadow-blue);
    padding:22px 22px;
  }
  .task-card.current h3{color:#fff;font-size:17px;}
  .task-card.current .time-badge{color:rgba(255,255,255,.9);}
  .task-card.current .task-desc{color:rgba(255,255,255,.85);}
  .task-card.current .repeat-tag{color:rgba(255,255,255,.9);}
  .task-card.current .check{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.15);}
  .task-card.current .check.checked{background:#fff;border-color:#fff;color:var(--blue);}
  .task-card.current .cat-tag{background:rgba(255,255,255,.22)!important;color:#fff!important;}
  .task-card.current .icon-btn{color:rgba(255,255,255,.75);}
  .task-card.current .icon-btn:hover{background:rgba(255,255,255,.18);color:#fff;}

  .empty-state{
    text-align:center;padding:80px 20px;color:var(--muted);
    background:var(--card-soft);border-radius:var(--radius);font-weight:500;
  }
  .empty-state .big{font-size:38px;margin-bottom:12px;opacity:.8;}

  /* ---------- Chart view ---------- */
  .chart-section{background:var(--card-soft);border-radius:var(--radius);padding:28px;}
  .chart-wrap{display:flex;justify-content:center;}
  .chart-legend{
    display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center;margin-top:24px;
    padding-top:20px;border-top:1px solid var(--border);
  }
  .legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .legend-time{color:var(--muted);font-size:12px;}

  /* ---------- Month grid view (Naver-calendar style) ---------- */
  .month-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .month-title{font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .month-nav{display:flex;align-items:center;gap:6px;}
  .month-nav button{
    border:none;background:var(--card-soft);height:36px;border-radius:11px;cursor:pointer;
    color:var(--muted);font-weight:700;font-size:15px;line-height:1;padding:0 14px;
  }
  .month-nav button#monthToday{font-size:13px;}
  .month-nav button:hover{background:var(--blue-soft);color:var(--blue);}
  /* 월간: 주(週) 단위 그리드 + 여러 날 일정은 이어지는 막대(bar) */
  .month-grid{
    border:1px solid var(--border);border-radius:16px;overflow:hidden;
    background:var(--border);display:flex;flex-direction:column;gap:1px;
    --daynum-h:28px;--lane-h:20px;
  }
  .m-headrow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .m-head{background:#fff;text-align:center;padding:9px 0;font-size:12px;font-weight:700;color:var(--muted);}
  .m-head.sun{color:var(--danger);}
  .m-head.sat{color:var(--blue);}
  .m-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .m-cell{
    background:#fff;min-height:max(84px, calc((100dvh - 225px) / 6));
    min-width:0;overflow:hidden;cursor:pointer;
    padding:5px 4px 0;transition:background .1s ease;
  }
  .m-cell:hover{background:#fafbfe;}
  .m-cell.other{background:#fbfbfc;}
  .m-cell.selected{background:var(--blue-soft);}
  .m-daynum{
    font-size:13px;font-weight:700;color:var(--text);
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  }
  .m-cell.other .m-daynum{color:#ccd0d9;}
  .m-cell.sun .m-daynum{color:var(--danger);}
  .m-cell.sat .m-daynum{color:var(--blue);}
  .m-cell.today .m-daynum{background:var(--blue);color:#fff;}
  .m-bar{
    z-index:1;margin:0 2px;height:calc(var(--lane-h) - 4px);align-self:center;
    border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;line-height:calc(var(--lane-h) - 4px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
    pointer-events:none;   /* 막대를 눌러도 밑의 날짜 칸이 클릭을 받도록 */
  }
  .m-bar.cont-left{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;}
  .m-bar.cont-right{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0;}
  .m-more2{z-index:1;align-self:center;font-size:10px;color:var(--muted);font-weight:700;padding:0 5px;cursor:pointer;}
  /* 월간 뷰: 달력 아래 그날 일정 리스트 헤더 */
  .month-daylist-head{margin:26px 0 16px;font-size:17px;font-weight:800;color:var(--text);}
  #monthDayList{position:relative;}

  @media (max-width:720px){
    .month-grid{--daynum-h:24px;--lane-h:16px;}
    .m-cell{min-height:max(52px, calc((100dvh - 280px) / 6));padding:4px 2px 0;}
    .m-bar{font-size:9.5px;padding:0 4px;margin:0 1px;}
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(27,30,40,.42);display:none;
    align-items:center;justify-content:center;z-index:50;
    padding:30px;overflow-y:auto;backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:22px;width:420px;max-width:92vw;padding:28px;
    box-shadow:0 24px 60px rgba(27,30,40,.25);
    max-height:calc(100vh - 60px);overflow-y:auto;
  }
  .modal h2{margin:0 0 20px;font-size:20px;font-weight:800;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700;}
  .field input[type=text],.field input[type=time],.field input[type=date],.field textarea,.field select{
    width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;
    font-size:13.5px;font-family:inherit;background:var(--card-soft);color:var(--text);
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-soft);
  }
  .field textarea{resize:vertical;min-height:56px;}
  /* 모바일(아이폰)에서 입력칸 탭할 때 자동 확대 방지: 글자 16px 이상이면 확대 안 됨 */
  @media (max-width:768px){
    .field input[type=text],.field input[type=time],.field input[type=date],.field textarea,.field select{
      font-size:16px;
    }
  }
  .field-check{display:flex;align-items:center;gap:9px;}
  .field-check input{width:auto;margin:0;cursor:pointer;transform:scale(1.15);accent-color:var(--blue);}

  /* 일정 / 할일 전환 토글 */

  .wd-pill{

  @media (max-width:720px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--border);}
    .main{padding:24px 20px;}
    .date-block h1{font-size:32px;}
    /* 모바일: 큰 월간 달력이 있으니 사이드바 미니 달력은 숨김(중복 방지) */

    /* 모바일: 카테고리 영역 + 내보내기/가져오기 숨김 (로그아웃은 유지) */

  *:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#e2e5ec;border-radius:8px;}

  /* ---------- Login gate (cloud mode) ---------- */
  .login-gate{
    position:fixed;inset:0;background:#fff;display:none;

<script>
(function(){
  "use strict";

  const LS_TASKS = "scheduler_tasks_v1";
  const LS_CATS = "scheduler_categories_v1";
  const WEEKDAYS_KO = ["일","월","화","수","목","금","토"];
  const PALETTE = ["#4f7df3","#37c48f","#ffb84f","#f26d6d","#a06cf2","#22b8cf","#ff8fb1","#7c8794"];

  const DEFAULT_CATS = [
    {id:"work", name:"업무", color:"#4f7df3"},
    {id:"exercise", name:"운동", color:"#37c48f"},
    {id:"meal", name:"식사", color:"#ffb84f"},
    {id:"personal", name:"개인", color:"#a06cf2"},
  ];

  // ---- 신뢰 경계 새니타이즈(가져오기/클라우드) ----
  const MAX_TASKS = 5000, MAX_CATS = 200;
  const REPEAT_TYPES = ["none","daily","weekly","monthly"];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const TIME_RE = /^\d{2}:\d{2}$/;
  function safeStr(v, max){ return (typeof v==="string" ? v : "").slice(0, max); }
  function safeId(v){
    const s = String(v==null ? "" : v).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
    return s || uid();
  }
  // style 속성에 들어가므로 hex 색상만 허용, 아니면 기본색
  function safeColor(v){
    return (typeof v==="string" && /^#[0-9a-fA-F]{3,8}$/.test(v)) ? v : PALETTE[0];
  }
  function safeDate(v){ return (typeof v==="string" && DATE_RE.test(v)) ? v : ""; }
  function safeDateArr(a){
    return Array.isArray(a) ? a.filter(d=>typeof d==="string" && DATE_RE.test(d)).slice(0, 2000) : [];
  }
  function safeRepeat(r){
    if(!r || typeof r!=="object") return {type:"none", days:[], until:""};
    const type = REPEAT_TYPES.includes(r.type) ? r.type : "none";
    const days = Array.isArray(r.days)
      ? [...new Set(r.days.map(Number).filter(n=>Number.isInteger(n) && n>=0 && n<=6))]
      : [];
    return { type, days, until: safeDate(r.until) };
  }

  const REMIND_VALUES = ["none","0","10","30","60","1440"];
  function safeTime(v){ return (typeof v==="string" && TIME_RE.test(v)) ? v : ""; }
  function safeRemind(v){ return REMIND_VALUES.includes(String(v)) ? String(v) : "none"; }

  function normalizeTask(t){
    t = (t && typeof t==="object") ? t : {};
    const date = safeDate(t.date);
    return {
      id: safeId(t.id),
      type: t.type === "todo" ? "todo" : "event",
      title: safeStr(t.title, 200),
      location: safeStr(t.location, 200),
      important: !!t.important,
      date: date,
      endDate: safeDate(t.endDate),
      time: safeTime(t.time),
      endTime: safeTime(t.endTime),
      allDay: !!t.allDay,
      desc: safeStr(t.desc, 2000),
      category: safeId(t.category),
      repeat: safeRepeat(t.repeat),
      remind: safeRemind(t.remind),
      doneDates: t.doneDates ? safeDateArr(t.doneDates) : (t.done && date ? [date] : []),
      skipDates: safeDateArr(t.skipDates),
    };
  }
  function normalizeCategory(c){
    c = (c && typeof c==="object") ? c : {};
    return { id: safeId(c.id), name: safeStr(c.name, 60) || "카테고리", color: safeColor(c.color) };
  }
  // 외부에서 들어온 {tasks, categories} 전체를 정제
  function sanitizeData(data){
    const out = {};
    if(Array.isArray(data && data.tasks)) out.tasks = data.tasks.slice(0, MAX_TASKS).map(normalizeTask);
    if(Array.isArray(data && data.categories) && data.categories.length)
      out.categories = data.categories.slice(0, MAX_CATS).map(normalizeCategory);
    return out;
  }

  let tasks = (JSON.parse(localStorage.getItem(LS_TASKS) || "[]")).map(normalizeTask);
  let categories = (JSON.parse(localStorage.getItem(LS_CATS) || "null") || DEFAULT_CATS.slice()).map(normalizeCategory);
  let activeCatFilter = new Set(categories.map(c=>c.id)); // all on by default
  let selectedDate = new Date();
  let calViewDate = new Date();
  let editingCatColor = PALETTE[0];
  let editingRepeatDays = [];
  let currentView = "month"; // 'timeline' | 'chart' | 'month'

  function fmt(d){ // yyyy-mm-dd local
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function sameDay(a,b){ return fmt(a)===fmt(b); }
  function saveTasks(){ localStorage.setItem(LS_TASKS, JSON.stringify(tasks)); cloudSaveSoon(); }
  function saveCats(){ localStorage.setItem(LS_CATS, JSON.stringify(categories)); cloudSaveSoon(); }
  function catById(id){ return categories.find(c=>c.id===id) || categories[0]; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // ============================================================
  //  Cloud sync (Firebase) — 아래 firebaseConfig에 본인 설정을 붙여넣으면 켜집니다.
  //  비워두면 지금처럼 이 브라우저에만 저장(로컬 모드)됩니다.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDW_kxiusVnRXsMrQ-bDT60v8kUJeqBcYQ",
    authDomain: "ddak-sch.firebaseapp.com",
    projectId: "ddak-sch",
    storageBucket: "ddak-sch.firebasestorage.app",
    messagingSenderId: "65116543157",
    appId: "1:65116543157:web:35d631d583fe96950286fc",
    measurementId: "G-HBJ2P7WT7Z"
  };
  const CLOUD_ENABLED = !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("여기에") === -1;
  // Google 로그인(Identity Services) 웹 클라이언트 ID
  const GIS_CLIENT_ID = "65116543157-csqh2fdma659o1dn6f2ppi2ojo4ji2td.apps.googleusercontent.com";

  let db = null, currentUser = null, cloudReady = false, cloudUnsub = null, cloudWriteTimer = null;

  function cloudSaveSoon(){
    if(!cloudReady || !currentUser) return;
    clearTimeout(cloudWriteTimer);
    cloudWriteTimer = setTimeout(()=>{
      db.collection("users").doc(currentUser.uid)
        .set({ tasks, categories, updatedAt: Date.now() })
        .catch(err=>console.warn("클라우드 저장 실패:", err));
    }, 500);
  }

  function startCloudSync(uid){
    if(cloudUnsub) cloudUnsub();
    cloudUnsub = db.collection("users").doc(uid).onSnapshot(doc=>{
      if(!doc.exists){ cloudSaveSoon(); return; } // 첫 로그인: 지금 로컬 데이터를 클라우드에 올림
      const clean = sanitizeData(doc.data() || {});
      if(clean.tasks) tasks = clean.tasks;
      if(clean.categories) categories = clean.categories;
      activeCatFilter = new Set(categories.map(c=>c.id));
      renderAll();
    }, err=>console.warn("동기화 오류:", err));
  }

  function showLoginGate(){ const g=document.getElementById("loginGate"); if(g) g.classList.add("show"); }
  function hideLoginGate(){ const g=document.getElementById("loginGate"); if(g) g.classList.remove("show"); }

  function initCloud(){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    cloudReady = true;
    const signOutBtn = document.getElementById("signOutBtn");
    const greetEl = document.getElementById("userGreeting");
    firebase.auth().onAuthStateChanged(user=>{
      currentUser = user;
      if(user){
        hideLoginGate();
        if(signOutBtn) signOutBtn.style.display = "block";
        if(greetEl){
          const nm = user.displayName || (user.email ? user.email.split("@")[0] : "회원");
          greetEl.textContent = `${nm}님, 환영합니다!`;
          greetEl.style.display = "block";
        }
        startCloudSync(user.uid);
      } else {
        if(cloudUnsub){ cloudUnsub(); cloudUnsub = null; }
        if(signOutBtn) signOutBtn.style.display = "none";
        if(greetEl) greetEl.style.display = "none";
        showLoginGate();
      }
    });
    // ---- Google Identity Services 로그인 ----
    // 팝업/리다이렉트 없이 페이지 안에서 ID 토큰을 받아 Firebase에 로그인 → 사파리 도메인 문제 없음
    function onGoogleCredential(resp){
      const keep = document.getElementById("keepLogin");
      const persistence = (keep && !keep.checked)
        ? firebase.auth.Auth.Persistence.SESSION
        : firebase.auth.Auth.Persistence.LOCAL;
      const cred = firebase.auth.GoogleAuthProvider.credential(resp.credential);
      firebase.auth().setPersistence(persistence)
        .then(()=> firebase.auth().signInWithCredential(cred))
        .catch(err=> alert("로그인 실패: "+err.message));
    }
    let gisTries = 0;
    function initGoogleSignIn(){
      if(!(window.google && google.accounts && google.accounts.id)){
        if(gisTries++ < 40) return setTimeout(initGoogleSignIn, 250); // 스크립트 로딩 대기
        return;
      }
      google.accounts.id.initialize({
        client_id: GIS_CLIENT_ID,
        callback: onGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
      });
      const wrap = document.getElementById("gisBtn");
      if(wrap){
        wrap.innerHTML = "";
        google.accounts.id.renderButton(wrap, {
          type:"standard", theme:"filled_blue", size:"large",
          shape:"pill", text:"signin_with", locale:"ko", width:280,
        });
      }
    }
    initGoogleSignIn();
    if(signOutBtn) signOutBtn.addEventListener("click", ()=>{
      try{ google.accounts.id.disableAutoSelect(); }catch(e){}
      firebase.auth().signOut();
    });
  }

  // ---------- Recurrence logic ----------
  function occursOn(task, dateStr){
    if(dateStr < task.date) return false;
    if(task.repeat && task.repeat.until && dateStr > task.repeat.until) return false;
    if(task.skipDates && task.skipDates.includes(dateStr)) return false;
    const rep = task.repeat || {type:"none"};
    if(rep.type === "none"){
      // 여러 날 일정이면 시작~종료 사이 모든 날에 표시 (dateStr >= task.date 는 위에서 보장)
      const end = (task.endDate && task.endDate >= task.date) ? task.endDate : task.date;
      return dateStr <= end;
    }
    if(rep.type === "daily") return true;
    if(rep.type === "weekly"){
      const dow = new Date(dateStr+"T00:00:00").getDay();
      return (rep.days||[]).includes(dow);
    }
    if(rep.type === "monthly"){
      const d1 = new Date(task.date+"T00:00:00").getDate();
      const d2 = new Date(dateStr+"T00:00:00").getDate();
      return d1 === d2;
    }
    return false;
  }
  function tasksForDate(dateStr){
    return tasks.filter(t=>occursOn(t, dateStr));
  }
  function isDone(task, dateStr){ return (task.doneDates||[]).includes(dateStr); }
  function toggleDone(task, dateStr){
    if(!task.doneDates) task.doneDates=[];
    const idx = task.doneDates.indexOf(dateStr);
    if(idx>=0) task.doneDates.splice(idx,1); else task.doneDates.push(dateStr);
  }
  function repeatLabel(rep){
    if(!rep || rep.type==="none") return "";
    if(rep.type==="daily") return "↻ 매일 반복";
    if(rep.type==="weekly") return "↻ 매주 " + (rep.days||[]).slice().sort().map(d=>WEEKDAYS_KO[d]).join(",") + " 반복";
    if(rep.type==="monthly") return "↻ 매월 반복";
    return "";
  }
  function multiDayLabel(t, dateStr){
    const DAY = 86400000;
    const start = new Date(t.date+"T00:00:00");
    const end = new Date(t.endDate+"T00:00:00");
    const cur = new Date(dateStr+"T00:00:00");
    const total = Math.round((end-start)/DAY) + 1;
    const idx = Math.round((cur-start)/DAY) + 1;
    return `🧳 ${total-1}박 ${total}일 · ${idx}일차`;
  }

      const item = document.createElement("div");
      item.className = "cat-item" + (activeCatFilter.has(c.id)?"":" off");
      item.innerHTML = `<span class="cat-swatch" style="background:${c.color}"></span><span class="name">${escapeHtml(c.name)}</span><span class="cnt">${count}</span><button class="cat-del" title="카테고리 삭제">✕</button>`;
      item.addEventListener("click", ()=>{

  function deleteCategory(c){
    if(categories.length<=1){ alert("카테고리는 최소 1개는 남겨두어야 해요."); return; }
    const count = tasks.filter(t=>t.category===c.id).length;
    const fallback = categories.find(x=>x.id!==c.id);
    const msg = count>0
      ? `'${c.name}' 카테고리를 삭제할까요?\n이 카테고리의 일정 ${count}개는 '${fallback.name}'(으)로 옮겨져요.`
      : `'${c.name}' 카테고리를 삭제할까요?`;
    if(!confirm(msg)) return;
    tasks.forEach(t=>{ if(t.category===c.id) t.category = fallback.id; });
    categories = categories.filter(x=>x.id!==c.id);
    activeCatFilter.delete(c.id);
    saveCats(); saveTasks();
    renderAll();
  }

  // ---------- Timeline ----------
  const timeline = document.getElementById("timeline");
  const todoListEl = document.getElementById("todoList");

  // 한 개 일정 카드 HTML (타임라인·리스트 공용). dateStr = 이 카드가 대표하는 날짜
  function taskRowHTML(t, dateStr, current){
    const cat = catById(t.category);
    const done = isDone(t, dateStr);
    const isRepeating = t.repeat && t.repeat.type !== "none";
    const isMulti = !!(t.endDate && t.endDate > t.date);
    return `
      <div class="track">
        <div class="node ${done?'done':''} ${current?'current':''}" style="border-color:${current?'#fff':cat.color};${done?`background:${cat.color}`:''}"></div>
        <div class="line"></div>
      </div>
      <div class="task-card ${done?'done':''} ${current?'current':''}">
        <div class="top-row">
          <div class="title-wrap">
            <div class="check ${done?'checked':''}" data-id="${t.id}" data-date="${dateStr}" style="${done?`background:${cat.color};border-color:${cat.color}`:''}">${done?'✓':''}</div>
            <h3>${t.important ? '<span class="task-imp" title="중요">★</span>' : ''}${escapeHtml(t.title)}</h3>
          </div>
          <div class="time-badge">${t.type==='todo' ? '☑ 할일' : (t.allDay ? '종일' : (t.time ? t.time + (t.endTime ? '~'+t.endTime : '') : ''))}</div>
        </div>
        ${t.location ? `<div class="task-desc">📍 ${escapeHtml(t.location)}</div>` : ''}
        ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ''}
        ${isRepeating ? `<div class="repeat-tag">${repeatLabel(t.repeat)}</div>` : ''}
        ${isMulti ? `<div class="repeat-tag" style="color:#2fa36f">${multiDayLabel(t, dateStr)}</div>` : ''}
        <div class="task-meta">
          <span class="cat-tag" style="background:${cat.color}22;color:${cat.color}">${escapeHtml(cat.name)}</span>
          <div class="task-actions">
            <button class="icon-btn edit" data-id="${t.id}" title="수정">✎</button>
            ${isRepeating ? `<button class="icon-btn skip" data-id="${t.id}" data-date="${dateStr}" title="이 날짜만 제외">⤫</button>` : ''}
            <button class="icon-btn del" data-id="${t.id}" title="전체 삭제">🗑</button>
          </div>
        </div>
      </div>`;
  }
  function attachTaskListeners(cont){
    cont.querySelectorAll(".check").forEach(el=>{
      el.addEventListener("click", ()=>{
        const t = tasks.find(x=>x.id===el.dataset.id);
        toggleDone(t, el.dataset.date); saveTasks(); renderAll();
      });
    });
    cont.querySelectorAll(".edit").forEach(el=>{
      el.addEventListener("click", ()=> openTaskModal(el.dataset.id));
    });
    cont.querySelectorAll(".skip").forEach(el=>{
      el.addEventListener("click", ()=>{
        const t = tasks.find(x=>x.id===el.dataset.id);
        if(confirm("이 날짜의 일정만 제외할까요? (다른 반복 날짜는 유지돼요)")){
          if(!t.skipDates) t.skipDates=[];
          t.skipDates.push(el.dataset.date);
          saveTasks(); renderAll();
        }
      });
    });
    cont.querySelectorAll(".del").forEach(el=>{
      el.addEventListener("click", ()=>{
        const t = tasks.find(x=>x.id===el.dataset.id);
        const msg = (t.repeat && t.repeat.type!=="none") ? "반복 일정 전체를 삭제할까요? (모든 날짜에서 사라져요)" : "이 일정을 삭제할까요?";
        if(confirm(msg)){
          tasks = tasks.filter(x=>x.id!==el.dataset.id);
          saveTasks(); renderAll();
        }
      });
    });
  }
  function renderTimeline(cont){
    cont = cont || timeline;   // 어느 영역에 그릴지 (기본: 타임라인 뷰)
    cont.innerHTML = "";
    const dateStr = fmt(selectedDate);
    const dayTasks = tasksForDate(dateStr)
      .filter(t=>activeCatFilter.has(t.category))
      .sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));

    if(dayTasks.length===0){
      cont.innerHTML = `<div class="empty-state"><div class="big">🗓️</div>이 날짜에 등록된 일정이 없어요.</div>`;
      return;
    }
    // "current" = 오늘 & 이미 시작했고 아직 안 끝낸 최근 일정 → 파란 강조 카드
    let currentId = null;
    if(sameDay(selectedDate, new Date())){
      const nowT = new Date().toTimeString().slice(0,5);
      const started = dayTasks.filter(t=>t.time && t.time<=nowT && !isDone(t,dateStr));
      if(started.length) currentId = started[started.length-1].id;
    }
    dayTasks.forEach(t=>{
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = taskRowHTML(t, dateStr, t.id===currentId);
      cont.appendChild(row);
    });
    attachTaskListeners(cont);
  }
  // 할일/일정 전체를 날짜별로 묶어 리스트로 (달력 아님)

  // ---------- Task Modal ----------

  function updateRepeatFieldsVisibility(){

  const allDayCheck = document.getElementById("taskAllDay");

  // 종료일 > 시작일(여러 날 일정)이면 반복 비활성화 (둘은 같이 못 씀)
  const repeatFieldEl = document.getElementById("repeatField");
  const startDateEl = document.getElementById("taskDate");
  const endDateEl = document.getElementById("taskEndDate");
  function updateRepeatAvailability(){
    const multi = startDateEl.value && endDateEl.value && endDateEl.value > startDateEl.value;

    if(endDateEl.value && endDateEl.value < startDateEl.value) endDateEl.value = startDateEl.value;

  // 일정(event) / 할일(todo) 전환 — 할일은 시간·반복·알림·장소 없이 간단하게
  let editingType = "event";
  function updateTypeFields(){
    const todo = editingType === "todo";

    document.getElementById("dtTilde").style.display = "";

    document.getElementById("taskEndTime").style.display = todo ? "none" : "";
    document.getElementById("taskDateLabel").textContent = todo ? "기간" : "일시";
    if(todo){
      repeatFieldEl.style.display = "none";
      repeatDaysField.style.display = "none";
      repeatUntilField.style.display = "none";

      repeatFieldEl.style.display = "";

  document.querySelectorAll(".tt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ editingType = btn.dataset.type; updateTypeFields(); });

  function openTaskModal(id){
    fillCategorySelect();

    document.getElementById("deleteTaskBtn").style.display = id ? "inline-block" : "none";

      document.getElementById("taskEndDate").value = t.endDate || t.date;
      document.getElementById("taskEndTime").value = t.endTime || "";

  document.getElementById("saveTaskBtn").addEventListener("click", ()=>{
    const title = document.getElementById("taskTitle").value.trim();
    if(!title){ alert("제목을 입력해주세요."); return; }
    const id = document.getElementById("taskId").value;
    const date = document.getElementById("taskDate").value || fmt(selectedDate);
    let endDate = document.getElementById("taskEndDate").value || date;
    if(endDate < date){ alert("종료일이 시작일보다 빠를 수 없어요."); return; }
    const multiDay = endDate > date;               // 여러 날 일정
    if(!multiDay) endDate = "";                     // 하루짜리는 endDate 비움(기존 로직 호환)

    const allDay = document.getElementById("taskAllDay").checked;
    const time = allDay ? "" : document.getElementById("taskTime").value;
    let endTime = allDay ? "" : document.getElementById("taskEndTime").value;
    if(time && endTime && !multiDay && endTime < time){ alert("종료 시간이 시작 시간보다 빠를 수 없어요."); return; }

    const repType = multiDay ? "none" : repeatTypeSel.value;   // 여러 날 일정이면 반복 안 함
    let repDays = editingRepeatDays.slice();
    if(repType==="weekly" && repDays.length===0){
      repDays = [new Date(date+"T00:00:00").getDay()];
    }
    const remind = document.getElementById("taskRemind").value;
    if(remind !== "none") ensureNotifyPermission();

    const isTodo = editingType === "todo";
    const data = {
      type: isTodo ? "todo" : "event",
      title,
      location: isTodo ? "" : document.getElementById("taskLocation").value.trim(),
      important: document.getElementById("taskImportant").checked,
      date,
      endDate,
      time: isTodo ? "" : time,
      endTime: isTodo ? "" : endTime,
      allDay: isTodo ? true : allDay,     // 할일은 시간 없음(종일 취급)
      desc: document.getElementById("taskDesc").value.trim(),
      category: taskCategorySel.value,
      remind: isTodo ? "none" : remind,
      repeat: isTodo ? {type:"none",days:[],until:""} : {
        type: repType,
        days: repType==="weekly" ? repDays : [],
        until: repType==="none" ? "" : document.getElementById("taskRepeatUntil").value,
      },
    };
    if(id){
      const t = tasks.find(x=>x.id===id);
      Object.assign(t, data);
    } else {
      tasks.push(Object.assign({id:uid(), doneDates:[], skipDates:[]}, data));
    }
    saveTasks();
    closeTaskModal();
    selectedDate = new Date(data.date + "T00:00:00");
    renderAll();
  });

  document.getElementById("deleteTaskBtn").addEventListener("click", ()=>{
    const id = document.getElementById("taskId").value;
    if(id && confirm("이 일정을 삭제할까요? (반복 일정이면 전체가 삭제돼요)")){
      tasks = tasks.filter(x=>x.id!==id);
      saveTasks(); closeTaskModal(); renderAll();
    }
  });

  // ---------- Category Modal ----------
  const catOverlay = document.getElementById("catOverlay");
  const colorPicker = document.getElementById("colorPicker");

  function renderColorPicker(){
    colorPicker.innerHTML = "";
    PALETTE.forEach(c=>{
      const sw = document.createElement("div");
      sw.className = "swatch-opt" + (c===editingCatColor ? " selected":"");
      sw.style.background = c;
      sw.addEventListener("click", ()=>{ editingCatColor = c; renderColorPicker(); });
      colorPicker.appendChild(sw);
    });
  }

  document.getElementById("addCatBtn").addEventListener("click", ()=>{
    document.getElementById("catName").value = "";
    editingCatColor = PALETTE[Math.floor(Math.random()*PALETTE.length)];
    renderColorPicker();
    catOverlay.classList.add("show");
    document.getElementById("catName").focus();
  });
  document.getElementById("cancelCatBtn").addEventListener("click", ()=> catOverlay.classList.remove("show"));
  catOverlay.addEventListener("click", (e)=>{ if(e.target===catOverlay) catOverlay.classList.remove("show"); });

  document.getElementById("saveCatBtn").addEventListener("click", ()=>{
    const name = document.getElementById("catName").value.trim();
    if(!name){ alert("카테고리 이름을 입력해주세요."); return; }
    const id = "c_" + uid();
    categories.push({id, name, color: editingCatColor});
    activeCatFilter.add(id);
    saveCats();
    catOverlay.classList.remove("show");
    renderAll();
  });

  // ---------- Day navigation ----------
  document.getElementById("dayPrev").addEventListener("click", ()=>{
    selectedDate.setDate(selectedDate.getDate()-1); calViewDate=new Date(selectedDate); renderAll();
  });
  document.getElementById("dayNext").addEventListener("click", ()=>{
    selectedDate.setDate(selectedDate.getDate()+1); calViewDate=new Date(selectedDate); renderAll();
  });

  // ---------- View toggle ----------
  function switchView(view){
    currentView = view;
    document.querySelectorAll(".vt-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
    document.getElementById("timelineView").style.display = view==="timeline" ? "block" : "none";
    document.getElementById("monthView").style.display    = view==="month"    ? "block" : "none";
    document.getElementById("todoView").style.display     = view==="todo"     ? "block" : "none";
    document.getElementById("eventView").style.display    = view==="event"    ? "block" : "none";
    if(view==="month"){ renderMonth(); renderMonthList(); }
    if(view==="timeline") renderTimeline();
    if(view==="todo") renderTypeList(todoListEl, "todo");
    if(view==="event") renderTypeList(eventListEl, "event");
  }
  document.querySelectorAll(".vt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> switchView(btn.dataset.view));
  });

  // ---------- Month grid ----------
  const monthGrid = document.getElementById("monthGrid");
  const monthTitle = document.getElementById("monthTitle");
  function renderMonth(){
    monthTitle.textContent = calViewDate.toLocaleDateString("ko-KR",{year:"numeric",month:"long"});
    monthGrid.innerHTML = "";
    // 요일 헤더
    const headRow = document.createElement("div");
    headRow.className = "m-headrow";
    ["일","월","화","수","목","금","토"].forEach((w,i)=>{
      const h = document.createElement("div");
      h.className = "m-head" + (i===0?" sun":i===6?" sat":"");
      h.textContent = w;
      headRow.appendChild(h);
    });
    monthGrid.appendChild(headRow);

    const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
    const startOffset = new Date(year,month,1).getDay();
    const gridStart = new Date(year,month,1-startOffset);
    const today = new Date();
    const MAX_LANES = 3;
    const visibleTasks = tasks.filter(t=>activeCatFilter.has(t.category));
    const selectDay = (d)=>{
      selectedDate = new Date(d); calViewDate = new Date(d);
      renderMonth(); renderMonthList(); renderMiniCal(); renderHeader();
      // 달력이 화면을 꽉 채우므로, 그 날 타임라인이 보이도록 아래로 스크롤
      const head = document.getElementById("monthDayHead");
      if(head) head.scrollIntoView({behavior:"smooth", block:"start"});
    };

    for(let w=0; w<6; w++){
      const wd=[]; for(let c=0;c<7;c++){ const d=new Date(gridStart); d.setDate(gridStart.getDate()+w*7+c); wd.push(d); }
      const ws = wd.map(fmt);
      const weekStart = ws[0], weekEnd = ws[6];

      // 이 주에 들어가는 세그먼트 수집 (여러날=하나의 막대, 단일/반복=칸별)
      const segs = [];
      visibleTasks.forEach(t=>{
        const isMulti = !!(t.endDate && t.endDate > t.date);
        if(isMulti){
          if(t.date <= weekEnd && t.endDate >= weekStart){
            const s = t.date > weekStart ? t.date : weekStart;
            const e = t.endDate < weekEnd ? t.endDate : weekEnd;
            segs.push({t, startCol: ws.indexOf(s), endCol: ws.indexOf(e),
                       contLeft: t.date < weekStart, contRight: t.endDate > weekEnd, multi:true});
          }
        } else {
          for(let c=0;c<7;c++){ if(occursOn(t, ws[c])) segs.push({t, startCol:c, endCol:c, multi:false}); }
        }
      });
      // 레인 배정: 여러날 먼저(길이 긴 순) → 단일(시간순), 겹치면 다음 레인
      segs.sort((a,b)=>{
        if(a.multi!==b.multi) return a.multi?-1:1;
        if(a.startCol!==b.startCol) return a.startCol-b.startCol;
        const la=a.endCol-a.startCol, lb=b.endCol-b.startCol;
        if(la!==lb) return lb-la;
        return (a.t.time||"99:99").localeCompare(b.t.time||"99:99");
      });
      const laneOcc = [];
      segs.forEach(seg=>{
        let lane=0;
        for(;;){
          const occ = laneOcc[lane] || (laneOcc[lane]=[]);
          if(occ.every(r=> seg.endCol < r[0] || seg.startCol > r[1])){
            occ.push([seg.startCol, seg.endCol]); seg.lane=lane; break;
          }
          lane++;
        }
      });
      const overflow=[0,0,0,0,0,0,0];
      let maxShownLane=-1;
      segs.forEach(seg=>{
        if(seg.lane>=MAX_LANES){ for(let c=seg.startCol;c<=seg.endCol;c++) overflow[c]++; }
        else if(seg.lane>maxShownLane) maxShownLane=seg.lane;
      });
      const anyOverflow = overflow.some(n=>n>0);
      const laneRows = (maxShownLane+1) + (anyOverflow?1:0);

      const week = document.createElement("div");
      week.className = "m-week";
      week.style.gridTemplateRows = `var(--daynum-h) repeat(${Math.max(laneRows,1)}, var(--lane-h)) 1fr`;

      // 배경 날짜 칸 (전체 행 span, 클릭 시 그 날 선택)
      wd.forEach((d,c)=>{
        const dow=d.getDay();
        const cell=document.createElement("div");
        cell.className = "m-cell"
          + (d.getMonth()!==month ? " other" : "")
          + (dow===0 ? " sun" : dow===6 ? " sat" : "")
          + (sameDay(d,today) ? " today" : "")
          + (sameDay(d,selectedDate) ? " selected" : "");
        cell.style.gridColumn = String(c+1);
        cell.style.gridRow = "1 / -1";
        const num=document.createElement("div"); num.className="m-daynum"; num.textContent=d.getDate();
        cell.appendChild(num);
        cell.addEventListener("click", ()=>selectDay(d));
        week.appendChild(cell);
      });

      // 이벤트 막대
      segs.forEach(seg=>{
        if(seg.lane>=MAX_LANES) return;
        const t=seg.t, cat=catById(t.category);
        const bar=document.createElement("div");
        bar.className="m-bar"+(seg.contLeft?" cont-left":"")+(seg.contRight?" cont-right":"");
        bar.style.gridColumn=`${seg.startCol+1} / span ${seg.endCol-seg.startCol+1}`;
        bar.style.gridRow=String(seg.lane+2);
        bar.style.background=cat.color+"22";
        bar.style.color=cat.color;
        const prefix = t.type==='todo' ? '☑ ' : (!seg.multi && t.time ? t.time+' ' : '');
        bar.textContent = prefix + t.title;
        bar.title = t.title;
        week.appendChild(bar);
      });

      // 넘치는 일정 +N (그 날 선택으로 상세 보기)
      if(anyOverflow){
        const moreRow = maxShownLane + 3;
        for(let c=0;c<7;c++){ if(overflow[c]>0){
          const m=document.createElement("div"); m.className="m-more2";
          m.textContent=`+${overflow[c]}`;
          m.style.gridColumn=String(c+1);
          m.style.gridRow=String(moreRow);
          m.addEventListener("click", ()=>selectDay(wd[c]));
          week.appendChild(m);
        }}
      }
      monthGrid.appendChild(week);
    }
  }
  // 월간 뷰: 달력 아래 "선택한 날 일정" 리스트
  const monthDayListEl = document.getElementById("monthDayList");
  function renderMonthList(){
    const head = document.getElementById("monthDayHead");
    head.textContent = selectedDate.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});
    renderTimeline(monthDayListEl);
  }
  document.getElementById("monthPrev").addEventListener("click", ()=>{
    calViewDate.setMonth(calViewDate.getMonth()-1); renderMonth(); renderMiniCal();
  });
  document.getElementById("monthNext").addEventListener("click", ()=>{
    calViewDate.setMonth(calViewDate.getMonth()+1); renderMonth(); renderMiniCal();
  });
  document.getElementById("monthToday").addEventListener("click", ()=>{
    calViewDate = new Date(); renderMonth(); renderMiniCal();
  });

  // ---------- Chart (selected day's timeline, drawn as a 24h clock) ----------
  const chartWrapEl = document.getElementById("chartWrap");
  const chartLegendEl = document.getElementById("chartLegend");

  function timeToHours(str){
    const [h,m] = str.split(":").map(Number);
    return h + (m||0)/60;
  }
  function polar(cx,cy,r,angleDeg){
    const rad = angleDeg * Math.PI/180;
    return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
  }
  function pieSlicePath(cx,cy,R,a0,a1){
    const p0 = polar(cx,cy,R,a0);
    const p1 = polar(cx,cy,R,a1);
    const largeArc = (a1-a0) > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Z`;
  }
  function ringArcPath(cx,cy,R,r0,a0,a1){
    const po0=polar(cx,cy,R,a0), po1=polar(cx,cy,R,a1);
    const pi1=polar(cx,cy,r0,a1), pi0=polar(cx,cy,r0,a0);
    const largeArc=(a1-a0)>180?1:0;
    return `M ${po0.x.toFixed(2)} ${po0.y.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${po1.x.toFixed(2)} ${po1.y.toFixed(2)} L ${pi1.x.toFixed(2)} ${pi1.y.toFixed(2)} A ${r0} ${r0} 0 ${largeArc} 0 ${pi0.x.toFixed(2)} ${pi0.y.toFixed(2)} Z`;
  }
  function fullRingPath(cx,cy,R,r0){
    return `M ${cx-R} ${cy} A ${R} ${R} 0 1 1 ${cx+R} ${cy} A ${R} ${R} 0 1 1 ${cx-R} ${cy} M ${cx-r0} ${cy} A ${r0} ${r0} 0 1 0 ${cx+r0} ${cy} A ${r0} ${r0} 0 1 0 ${cx-r0} ${cy} Z`;
  }
  function hh(hDecimal){
    let h = Math.floor(hDecimal) % 24;
    const m = Math.round((hDecimal - Math.floor(hDecimal))*60);
    return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  }

  function renderChart(){
    const dateStr = fmt(selectedDate);
    const dayTasks = tasksForDate(dateStr).filter(t=>activeCatFilter.has(t.category));
    const timed = dayTasks.filter(t=>t.time).slice().sort((a,b)=> timeToHours(a.time)-timeToHours(b.time));
    const untimedCount = dayTasks.length - timed.length;

    const cx=250, cy=250, R=185, ringOuter=207, ringInner=196;
    const parts = [];
    // 테마별 색 (다크에서 흰 배경/검은 글자 → 어둡게)
    const dark = document.documentElement.getAttribute("data-theme")==="dark";
    const chartFace = dark ? "#1f2129" : "#ffffff";
    const chartRingBg = dark ? "#2a2d36" : "#e4e7ee";
    const chartText = dark ? "#f2f3f5" : "#1b1e28";

    // base ring (always drawn, even with no tasks, so the wheel is never blank)
    const isToday = sameDay(selectedDate, new Date());
    if(isToday){
      const now = new Date();
      const nowA = (now.getHours() + now.getMinutes()/60)/24*360;
      parts.push(`<path d="${ringArcPath(cx,cy,ringOuter,ringInner,0,nowA)}" fill="#f0728f"/>`);
      parts.push(`<path d="${ringArcPath(cx,cy,ringOuter,ringInner,nowA,360)}" fill="${chartRingBg}"/>`);
    } else {
      parts.push(`<path d="${fullRingPath(cx,cy,ringOuter,ringInner)}" fill="${chartRingBg}" fill-rule="evenodd"/>`);
    }
    // empty face circle underneath slices, so unscheduled hours read as blank, not missing
    parts.push(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${chartFace}"/>`);

    let segs = [];
    if(timed.length===1){
      segs = [{task:timed[0], startH: timeToHours(timed[0].time), endH: timeToHours(timed[0].time)+24}];
    } else if(timed.length>1){
      for(let i=0;i<timed.length;i++){
        const startH = timeToHours(timed[i].time);
        let endH;
        if(i<timed.length-1){
          endH = timeToHours(timed[i+1].time);
          if(endH<=startH) endH = startH;
        } else {
          endH = timeToHours(timed[0].time) + 24;
        }
        segs.push({task:timed[i], startH, endH});
      }
    }

    segs.forEach(seg=>{
      if(seg.endH<=seg.startH) return;
      const cat = catById(seg.task.category);
      const a0 = seg.startH/24*360;
      const a1 = seg.endH/24*360;
      parts.push(`<path d="${pieSlicePath(cx,cy,R,a0,a1)}" fill="${cat.color}" stroke="${chartFace}" stroke-width="1.5"/>`);

      let mid = (a0+a1)/2;
      const labelR = R*0.62;
      const pt = polar(cx,cy,labelR,mid);
      const rot = mid<=180 ? mid-90 : mid+90;
      const label = escapeHtml(seg.task.title).slice(0,10);
      parts.push(`<text x="${pt.x.toFixed(2)}" y="${pt.y.toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${pt.x.toFixed(2)} ${pt.y.toFixed(2)})" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#ffffff">${label}</text>`);

      const bpt = polar(cx,cy,R+16,a0);
      const norm = ((a0%360)+360)%360;
      const anchor = (norm>2 && norm<178) ? "start" : (norm>182 && norm<358 ? "end" : "middle");
      parts.push(`<text x="${bpt.x.toFixed(2)}" y="${bpt.y.toFixed(2)}" text-anchor="${anchor}" font-size="10.5" font-weight="600" fill="#f0728f" dominant-baseline="middle">${seg.task.time}</text>`);
    });

    [0,6,12,18].forEach(h=>{
      const a = h/24*360;
      const pt = polar(cx,cy,R+38,a);
      const label = h===0 ? "24" : String(h);
      parts.push(`<text x="${pt.x.toFixed(2)}" y="${pt.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="800" fill="${chartText}">${label}</text>`);
    });

    chartWrapEl.innerHTML = `<svg viewBox="0 0 500 500" width="100%" style="max-width:520px;display:block;">${parts.join("")}</svg>`;

    let legendHtml = segs.map(seg=>{
      const cat = catById(seg.task.category);
      const endLabel = (seg.endH>=24 ? "익일 " : "") + hh(seg.endH);
      return `<div class="legend-item"><span class="legend-dot" style="background:${cat.color}"></span>${escapeHtml(seg.task.title)}<span class="legend-time">${seg.task.time}–${endLabel}</span></div>`;
    }).join("");
    if(untimedCount>0){
      legendHtml += `<div class="legend-item" style="color:var(--muted);">시간 미지정 ${untimedCount}개는 원형 시간표에 표시되지 않아요</div>`;
    }
    chartLegendEl.innerHTML = legendHtml;
  }

  // ---------- Render all ----------
  function renderAll(){
    renderMiniCal();
    renderCatList();
    renderWeekStrip();
    renderHeader();
    renderTimeline();
    if(currentView==="month"){ renderMonth(); renderMonthList(); }
    if(currentView==="todo") renderTypeList(todoListEl, "todo");
    if(currentView==="event") renderTypeList(eventListEl, "event");
  }

  // ---------- 알림 (브라우저 팝업) ----------
  // 참고: 사이트가 탭에 열려 있을 때만 울립니다. (메일/앱 종료 후 알림은 별도 서버 설정 필요)
  function ensureNotifyPermission(){
    if(!("Notification" in window)) return;
    if(Notification.permission === "default"){
      Notification.requestPermission().catch(()=>{});
    }
  }
  const remindFired = new Set();  // "날짜|id|remind" — 같은 알림 중복 방지
  function checkReminders(){
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date();
    [0,1].forEach(offset=>{                       // 오늘 + 내일(1일 전 알림 대응)
      const d = new Date(now); d.setDate(d.getDate()+offset);
      const ds = fmt(d);
      tasksForDate(ds).forEach(t=>{
        if(!t.remind || t.remind==="none" || t.allDay || !t.time) return;
        const [hh,mm] = t.time.split(":").map(Number);
        const trigger = new Date(ds+"T00:00:00");
        trigger.setHours(hh, mm - Number(t.remind), 0, 0);
        const key = ds+"|"+t.id+"|"+t.remind;
        const diff = now - trigger;
        if(diff>=0 && diff<60000 && !remindFired.has(key)){   // 예정 시각 지난 직후 1분 내
          remindFired.add(key);
          try{ new Notification("DDAKCAL 일정 알림", { body:`${t.time}  ${t.title}`, icon:"logo.png" }); }catch(e){}
        }
      });
    });
  }
  if("Notification" in window) setInterval(checkReminders, 30000);

  // ---------- 테마 (라이트/다크 전환) ----------
  const THEME_KEY = "ddakcal_theme";
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    const btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = (t==="dark") ? "☀️" : "🌙";
  }
  (function initTheme(){
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    const btn = document.getElementById("themeToggle");
    if(btn) btn.addEventListener("click", ()=>{
      const next = (document.documentElement.getAttribute("data-theme")==="dark") ? "light" : "dark";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });
  })();

  renderAll();
  if(CLOUD_ENABLED){ showLoginGate(); initCloud(); }
})();
</script>
<script>
  // 서비스워커 등록 (오프라인 구동 + 설치 가능)
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW 등록 실패:", err));
    });
  }

  // 앱처럼 — 핀치(두 손가락) 확대 차단. 더블탭 확대는 위 CSS touch-action:manipulation이 처리.
  // viewport 잠금(user-scalable=no)을 안 써서 iOS 화면이 확대된 채 굳는 버그가 없음.
  ["gesturestart","gesturechange","gestureend"].forEach(t=>{
    document.addEventListener(t, e=>e.preventDefault(), {passive:false});
  });
</script>
